<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | النظام</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            background-color: #f4f7f6;
            height: 100vh;
        }
        /* القائمة الجانبية */
        .sidebar {
            width: 250px;
            background-color: #1e3c72;
            color: #fff;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            box-shadow: -2px 0 5px rgba(0,0,0,0.1);
        }
        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .sidebar a {
            color: #fff;
            text-decoration: none;
            padding: 15px 20px;
            display: block;
            transition: background 0.3s;
            font-size: 16px;
        }
        .sidebar a:hover {
            background-color: #2a5298;
            border-right: 4px solid #00bcd4;
        }
        /* المحتوى الرئيسي */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        /* الشريط العلوي */
        .header {
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 20px;
            color: #333;
        }
        .logout-btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .logout-btn:hover {
            background-color: #b71c1c;
        }
        /* منطقة البطاقات */
        .cards-container {
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card h3 {
            color: #666;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .card .number {
            font-size: 32px;
            font-weight: bold;
            color: #1e3c72;
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <h2>نظام الإدارة</h2>
        <a href="#">🏠 الرئيسية</a>
        <a href="#">👥 المستخدمين</a>
        <a href="#">⚙️ الإعدادات</a>
        <a href="#">📊 التقارير</a>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <!-- الشريط العلوي -->
        <div class="header">
            <h1>مرحباً بك، أستاذ عمر!</h1>
            <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
        </div>

        <!-- الإحصائيات (البطاقات) -->
        <div class="cards-container">
            <div class="card">
                <h3>إجمالي المستخدمين</h3>
                <div class="number">150</div>
            </div>
            <div class="card">
                <h3>الزيارات اليومية</h3>
                <div class="number">42</div>
            </div>
            <div class="card">
                <h3>التنبيهات</h3>
                <div class="number">3</div>
            </div>
        </div>
    </div>

    <script>
        // دالة تسجيل الخروج للعودة لصفحة الدخول
        function logout() {
            window.location.href = '/login.html';
        }
    </script>

</body>
</html>
